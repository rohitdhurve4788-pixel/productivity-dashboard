<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity App</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" /> -->

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <section class="all-elems">

            <header>
                <div class="part1">
                    <h3>27 March, 2026</h3>
                    <h2>Friday, 5:00 pm</h2>
                    <h4>UMARGA - (MH)</h4>
                </div>

                <div class="part2">
                    <h3>34°C</h3>
                    <h5>Precipitation: 3%</h5>
                    <h5>Humidity: 22%</h5>
                    <h5>Wind: 8 km</h5>
                </div>
            </header>

            <div class="all-tasks">

                <div class="todo elems" id="0">
                    <img src="https://plus.unsplash.com/premium_photo-1681487867978-1b83ce2625c5" alt="">
                    <h2>Todo List</h2>
                </div>

                <div class="daily elems" id="1">
                    <img src="https://images.unsplash.com/photo-1597768164194-b804b42bd61a" alt="">
                    <h2>Daily Plan</h2>
                </div>

                <div class="moti elems" id="2">
                    <img src="https://images.unsplash.com/photo-1533678401910-65d369f886db" alt="">
                    <h2>Motivation</h2>
                </div>

                <div class="pomo elems" id="3">
                    <img src="https://images.unsplash.com/photo-1508962914676-134849a727f0" alt="">
                    <h2>Pomodoro</h2>
                </div>

                <div class="goals elems" id="4">
                    <img src="https://images.unsplash.com/photo-1610540604745-3e96fba9ccef" alt="">
                    <h2>Daily Goals</h2>
                </div>

            </div>
        </section>


        <!-- todo -->
        <section class="full-elem todo-list-cont">
            <button class="close" id="0">Close</button>

            <h2>Your Todo Lists</h2>

            <div class="todo-list-contianer">

                <div class="addtask">
                    <form>
                        <input type="text" placeholder="Enter task">
                        <textarea placeholder="Enter details"></textarea>

                        <div class="checkbox">
                            <input type="checkbox" id="subscribe">
                            <label for="subscribe">Mark As Important!</label>
                        </div>

                        <button>Add Task</button>
                    </form>
                </div>

                <div class="fulltask"></div>

            </div>
        </section>


        <!-- dailyplan -->
        <section class="full-elem daily-plan-cont">
            <button class="close" id="1">Close</button>
            <h2>Plan your day</h2>
            <div class="day-planner"></div>
        </section>


        <!-- motivasion -->
        <section class="full-elem motivation-cont">
            <button class="close" id="2">close</button>
                <i class="ri-close-large-line"></i>
            </button>

            <div class="color">
                <div class="maotiation-flex-contianer">
                    <div class="motivational-contianer">

                        <img src="./icons8-quotes-64.png" alt="">

                        <div class="content">
                            <h3>Quote of the day</h3>
                            <p></p>

                            <div class="content2">
                                <h5>AUTHOR</h5>
                                <h4></h4>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>


        <!-- pomo-timer -->
        <section class="full-elem pomo-cont">
            <button class="close" id="3">Close</button>

            <div class="work">
                <h4></h4>
            </div>

            <div class="pomo-timer">
                <h1>30:00</h1>
                <button class="start">START</button>
                <button class="pause">PAUSE</button>
                <button class="end">RESET</button>
            </div>
        </section>


        <!-- DAILY GOALS -->
        <section class="full-elem daily-cont">
            <button class="close" id="4">Close</button>

            <div class="container">
                <h2>Daily Goal Planner</h2>

                <div class="input-box">
                    <input type="text" id="taskInput" placeholder="Add your goal...">
                    <button onclick="addTask()">Add</button>
                </div>

                <ul id="taskList"></ul>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
